<script>
const stocks = [
  ["Apple Inc","AAPL","$233.16","+1.54%","$3.56T","35.5","up"],
  ["Microsoft Corp","MSFT","$520.42","-0.24%","$3.75T","32.6","down"],

  ["Amazon.com Inc","AMZN","$244.16","-1.53%","$1.45T","33.5","down"],
  ["Tesla Inc","TSLA","$339.62","+1.72%","$1.56T","161.2","up"],
  ["Meta Platforms","META","$762.96","-2.54%","$2.63T","45.6","down"],
  ["NVIDIA Corp","NVDA","$181.46","+2.21%","$1.36T","16.8","up"],

  ["Oracle Corp","ORCL","$244.63","+1.78%","$265.1B","58.9","up"],

  ["Intel Corporation","INTC","$254.45","-2.54%","$1.56T","16.8","down"]
];

const rowsEl = document.getElementById("rows");
stocks.forEach((s, i) => {
  const color = s[6] === "up" ? "#4ade80" : "#f87171";
  const bg = i % 2 === 0 ? "#141414" : "#181818";
  rowsEl.insertAdjacentHTML("beforeend", `
    <div style="display: grid; grid-template-columns: 18px 1.5fr 0.7fr 0.8fr 0.7fr 0.9fr 0.6fr 0.8fr; gap: 6px; padding: 8px 10px; background: ${bg}; font-size: 11px; align-items: center; border-top: 0.5px solid rgba(255,255,255,0.04);">

      <span style="color: #e5e5e5;">${s[0]}</span>
      <span style="color: #a3a3a3;">${s[1]}</span>
      <span style="color: #fff;">${s[2]}</span>
      <span style="color: ${color};">${s[3]}</span>
      <span style="color: #e5e5e5;">${s[4]}</span>
      <span style="color: #e5e5e5;">${s[5]}</span>
      <button style="background: transparent; color: #f5b544; border: 0.5px solid #f5b544; border-radius: 4px; padding: 3px 6px; font-size: 10px;">Add Alert</button>
    </div>
  `);
});

const alerts = [

  {name:"Tesla, Inc.", sym:"TSLA", price:"$340.84", chg:"-2.53%", chgColor:"#f87171", rule:"Price = $300.80", freq:"Once per minute", icon:`<div style="width:20px;height:20px;background:#e31937;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;">T</div>`, bg:"#e31937"},
  {name:"Meta Platforms", sym:"META", price:"$790.00", chg:"+1.4%", chgColor:"#4ade80", rule:"Price < $700.40", freq:"Once per hour", icon:`<div style="width:20px;height:20px;background:#1877f2;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;">∞</div>`, bg:"#1877f2"},
  {name:"Microsoft Corp.", sym:"MSFT", price:"$529.24", chg:"+1.4%", chgColor:"#4ade80", rule:"Price > $540.13", freq:"Once per day", icon:`<div style="width:20px;height:20px;display:grid;grid-template-columns:1fr 1fr;gap:1px;"><div style="background:#f25022;"></div><div style="background:#7fba00;"></div><div style="background:#00a4ef;"></div><div style="background:#ffb900;"></div></div>`, bg:"#1a1a1a"}
];

const alertsEl = document.getElementById("alerts");
alerts.forEach(a => {
  alertsEl.insertAdjacentHTML("beforeend", `
    <div style="background: #141414; border-radius: var(--border-radius-md); padding: 10px 12px;">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
        ${a.icon}
        <span style="font-size: 12px; font-weight: 500; color: #fff; flex: 1;">${a.name}</span>
        <span style="font-size: 10px; color: #a3a3a3;">${a.sym}</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 8px; padding-left: 28px;">
        <span style="color: #fff;">${a.price}</span>
        <span style="color: ${a.chgColor};">${a.chg}</span>
      </div>
      <div style="border-top: 0.5px solid rgba(255,255,255,0.08); padding-top: 8px; display: flex; align-items: center; justify-content: space-between;">

      </div>

});
</script>
